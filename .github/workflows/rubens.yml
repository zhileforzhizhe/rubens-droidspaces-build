name: K50 rubens DroidSpaces kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Build DroidSpaces + KernelSU kernel
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id

    steps:
    - uses: actions/checkout@v4

    - name: 读取配置
      run: |
        cat config.env | grep KERNEL_SOURCE= >> $GITHUB_ENV
        cat config.env | grep KERNEL_SOURCE_BRANCH= >> $GITHUB_ENV
        cat config.env | grep KERNEL_ZIP_NAME= >> $GITHUB_ENV
        cat config.env | grep KERNEL_IMAGE_NAME= >> $GITHUB_ENV

    - name: 安装编译依赖
      run: |
        sudo apt-get update
        sudo -E apt-get -y -qq install git make bc bison openssl zip kmod cpio flex libelf-dev curl libssl-dev wget device-tree-compiler ca-certificates python3 binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: 下载 Clang 编译器（只取需要的版本，省磁盘）
      run: |
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone -q --depth=1 --single-branch --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release clang-aosp
        cd clang-aosp
        git sparse-checkout set clang-r416183b
        ls clang-r416183b/bin/clang

    - name: 下载内核源码
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1

    - name: 打 DroidSpaces 官方 GKI 补丁（kABI 安全，不破坏原厂驱动兼容）
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        BASE=https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12
        ok=0
        for v in 6_7_8 3_4_5 1_2_3; do
          curl -LSs -o /tmp/001.patch "$BASE/001.GKI-below-6.12-fix_sysvipc_kabi_${v}.patch"
          if git apply --check /tmp/001.patch 2>/dev/null; then
            git apply /tmp/001.patch
            echo "SYSVIPC 补丁 ${v} 已应用"
            ok=1
            break
          fi
        done
        if [ "$ok" -ne 1 ]; then
          echo "三个 SYSVIPC 补丁变体都无法应用，需要人工检查源码"
          exit 1
        fi
        curl -LSs -o /tmp/002.patch "$BASE/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch"
        if git apply --check /tmp/002.patch 2>/dev/null; then
          git apply /tmp/002.patch
          echo "POSIX_MQUEUE 补丁已应用"
        else
          echo "警告: POSIX_MQUEUE 补丁无法应用，继续构建"
        fi

    - name: 织入 KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        test -d kernel/KernelSU || (echo "KernelSU 织入失败"; exit 1)
        ls -la drivers/kernelsu || true
        echo "KernelSU 织入完成"

    - name: 生成完整内核配置
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        make ARCH=arm64 gki_defconfig
        ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/xiaomi_mt6895.config
        ./scripts/kconfig/merge_config.sh -m .config arch/arm64/configs/vendor/rubens.config
        ./scripts/kconfig/merge_config.sh -m .config $GITHUB_WORKSPACE/droidspaces.config
        make ARCH=arm64 olddefconfig
        cp .config arch/arm64/configs/rubens_defconfig
        echo "===== 容器与 KSU 配置最终状态 ====="
        grep -E 'CONFIG_(SYSVIPC|POSIX_MQUEUE|PID_NS|IPC_NS|UTS_NS|NET_NS|USER_NS|CGROUP_DEVICE|DEVTMPFS|CFS_BANDWIDTH|CGROUP_PIDS|KSU)[= ]' .config || true

    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang-aosp/clang-r416183b/bin:$PATH
        export KBUILD_BUILD_HOST=github
        export KBUILD_BUILD_USER=droidspaces-builder
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export ARCH=arm64
        export CC=clang
        export HOSTCC=clang
        export HOSTCXX=clang++
        make -j$(nproc --all) O=out ARCH=arm64 rubens_defconfig
        make -j$(nproc --all) CC="clang -w" O=out ARCH=arm64 \
          CLANG_TRIPLE="aarch64-linux-gnu-" \
          CROSS_COMPILE="aarch64-linux-gnu-" \
          CROSS_COMPILE_ARM32="arm-linux-gnueabi-" \
          LLVM=1 LLVM_IAS=1

    - name: 打包 AnyKernel3 刷机包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone -q https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=1;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        rm -rf AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
        cd AnyKernel3
        zip -r9 $GITHUB_WORKSPACE/${{ env.KERNEL_ZIP_NAME }}.zip .
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p kernel_images
        cp android-kernel/out/arch/arm64/boot/Image kernel_images/ 2>/dev/null || true
        cp android-kernel/out/arch/arm64/boot/Image.gz kernel_images/ 2>/dev/null || true
        cp android-kernel/out/.config kernel_images/built-config.txt

    - name: 上传刷机包
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.KERNEL_ZIP_NAME }}
        path: kernel_workspace/${{ env.KERNEL_ZIP_NAME }}.zip

    - name: 上传内核镜像与最终配置
      uses: actions/upload-artifact@v4
      with:
        name: kernel_images
        path: kernel_workspace/kernel_images/*
